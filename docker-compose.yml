services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: flag-finder-fun:latest
    container_name: flag-finder-fun
    ports:
      - "3000:8080"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
