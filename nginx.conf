# ==============================================================================
# Nginx Configuration for Single Page Application (SPA)
# ==============================================================================
# This config optimizes nginx for serving a React/Vue/Angular SPA
# Key features: SPA routing, security headers, compression, caching

# server: Defines a virtual server block (you can have multiple servers)
server {
    # listen: Port(s) nginx listens on for incoming requests
    # 8080: Standard HTTP port (we use 8080 instead of 80 because we run as non-root user)
    # Non-root users cannot bind to privileged ports (<1024)
    listen 8080;
    
    # listen [::]:8080: Same as above but for IPv6 connections
    # Ensures the app works with both IPv4 and IPv6 clients
    listen [::]:8080;
    
    # server_name: Domain name(s) this server block responds to
    # "_" is a catch-all wildcard meaning "respond to any hostname"
    # In production, you'd use your actual domain: "example.com www.example.com"
    server_name _;
    
    # root: Directory where nginx looks for files to serve
    # This matches where we copy our built files in the Dockerfile
    root /usr/share/nginx/html;
    
    # index: Default file to serve when a directory is requested
    # When someone visits "/", nginx serves "/index.html"
    index index.html;

    # ==========================================================================
    # Security Headers
    # ==========================================================================
    # These HTTP headers protect against common web vulnerabilities
    # "always" ensures headers are sent even for error responses
    
    # X-Frame-Options: Prevents clickjacking attacks
    # "SAMEORIGIN" allows framing only from same domain
    # Prevents malicious sites from embedding your app in an iframe
    add_header X-Frame-Options "SAMEORIGIN" always;
    
    # X-Content-Type-Options: Prevents MIME-type sniffing
    # "nosniff" forces browser to respect declared content-type
    # Stops browsers from executing files as wrong type (e.g., treating image as JavaScript)
    add_header X-Content-Type-Options "nosniff" always;
    
    # X-XSS-Protection: Enables browser's XSS filter
    # "1; mode=block" tells browser to block page if XSS attack detected
    # Legacy header but still useful for older browsers
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Referrer-Policy: Controls how much referrer info is sent with requests
    # "no-referrer-when-downgrade" sends full URL except when going HTTPS→HTTP
    # Balances privacy with analytics/tracking needs
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # ==========================================================================
    # Gzip Compression
    # ==========================================================================
    # Compresses responses to reduce bandwidth and improve load times
    # Can reduce file sizes by 70-90% for text-based files
    
    # gzip on: Enable gzip compression
    gzip on;
    
    # gzip_vary on: Adds "Vary: Accept-Encoding" header
    # Tells caches (CDNs, proxies) to store both compressed and uncompressed versions
    # Important for clients that don't support gzip
    gzip_vary on;
    
    # gzip_min_length: Only compress files larger than this (in bytes)
    # 1024 bytes = 1KB - small files aren't worth compressing (overhead > savings)
    gzip_min_length 1024;
    
    # gzip_comp_level: Compression level (1-9)
    # 6 is a good balance between compression ratio and CPU usage
    # Higher = better compression but slower (diminishing returns after 6)
    gzip_comp_level 6;
    
    # gzip_types: MIME types to compress
    # Note: text/html is always compressed, no need to list it
    # This covers JS, CSS, JSON, fonts, SVG, etc.
    # Binary formats (jpeg, png) are already compressed, so excluded
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml font/truetype font/opentype 
               application/vnd.ms-fontobject image/svg+xml;

    # ==========================================================================
    # Cache Static Assets
    # ==========================================================================
    # location ~*: Case-insensitive regex match for file extensions
    # \. matches literal dot (escaped because . means "any char" in regex)
    # (jpg|jpeg|...) matches any of these file extensions
    # $ means end of string (ensures we match .jpg not .jpg.txt)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        # expires 1y: Cache these files for 1 year
        # Static assets with hashed filenames (like build-abc123.js) never change
        # When you deploy new version, filenames change, so old cache is irrelevant
        expires 1y;
        
        # Cache-Control: Modern caching header (replaces older Expires header)
        # "public" means can be cached by CDNs and proxies, not just browser
        # "immutable" tells browser file will NEVER change (no revalidation needed)
        # Saves bandwidth and improves performance on repeat visits
        add_header Cache-Control "public, immutable";
    }

    # ==========================================================================
    # SPA Routing
    # ==========================================================================
    # Single Page Applications use client-side routing (React Router, Vue Router, etc.)
    # When user visits /about, there's no /about.html file on server
    # We need to serve index.html for all routes and let JS handle routing
    
    # location /: Matches all requests (default location)
    location / {
        # try_files: Try to serve files in this order
        # $uri: Try to serve the exact file requested (e.g., /logo.png)
        # $uri/: If not found, try as a directory (e.g., /images/)
        # /index.html: If still not found, serve index.html (SPA fallback)
        # 
        # Example: User visits /products
        # 1. Try /products (file) - not found
        # 2. Try /products/ (directory) - not found  
        # 3. Serve /index.html - React Router handles /products route
        try_files $uri $uri/ /index.html;
    }

    # ==========================================================================
    # Security: Deny Hidden Files
    # ==========================================================================
    # location ~: Case-sensitive regex match
    # /\.: Matches any path with "/." (hidden files/folders)
    # Examples: /.git, /.env, /.htaccess
    location ~ /\. {
        # deny all: Return 403 Forbidden for these requests
        # Prevents accessing sensitive files that might accidentally be in build output
        # Examples of files attackers look for: .git, .env, .DS_Store
        deny all;
    }
}
